version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
    open-pull-requests-limit: 10
    labels: [dependencies, security]
    groups:
      # Group routine updates so security-relevant bumps stay visible.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patches:
        dependency-type: production
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:30'
    labels: [dependencies, ci]
