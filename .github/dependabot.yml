version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
    open-pull-requests-limit: 10
    labels: [dependencies, security]
    groups:
      # Group routine updates so security-relevant bumps stay visible.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patches:
        dependency-type: production
        update-types: [patch]
    ignore:
      # Major upgrades of the build toolchain are breaking by definition and
      # need a human to migrate. Security updates for a vulnerable version are
      # still opened regardless of this rule.
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:30'
    labels: [dependencies, ci]
