name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --install-strategy=hoisted

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Verify generated documentation is up to date
        run: |
          # generate-docs imports the compiled core package, so build it first.
          npm run build -w @detectionforge/core
          node scripts/generate-docs.mjs
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ is out of date. Run 'npm run docs' and commit the result."
            git diff --stat -- docs/
            exit 1
          fi
          echo "Generated documentation matches the code."

      - name: Build all packages
        run: npm run build

      - name: Scan build artifacts for embedded secrets
        run: node scripts/scan-build-artifacts.mjs packages/web/dist

      - name: Verify no environment file was committed
        run: |
          set -euo pipefail
          # Any tracked .env / .env.* / .dev.vars / key file, except the
          # placeholder-only .env.example, fails the build.
          tracked=$(git ls-files \
            | grep -E '(^|/)(\.env(\..*)?|\.dev\.vars(\..*)?|.*\.pem|.*\.p12|.*\.key)$' \
            | grep -v -x '.env.example' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Secret-bearing file(s) are tracked by git:"
            echo "$tracked"
            exit 1
          fi
          echo "No tracked environment or key files."

      - name: Upload frontend build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: packages/web/dist
          retention-days: 7

  sigma-validation:
    name: Validate generated Sigma rules with pySigma
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pySigma
        run: pip install --disable-pip-version-check sigma-cli

      - name: Build core and export generated Sigma rules
        run: |
          npm ci --install-strategy=hoisted
          npm run build -w @detectionforge/core
          node scripts/export-sigma-rules.mjs build/sigma-rules

      - name: Validate with the Sigma reference implementation
        run: python3 scripts/validate-sigma.py build/sigma-rules

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --install-strategy=hoisted

      - name: Audit production dependencies
        run: npm audit --audit-level=high
