name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Required so configure-pages can turn Pages on for this repository the
      # first time the workflow runs. Without it the run fails with
      # "Get Pages site failed" until someone enables Pages by hand.
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --install-strategy=hoisted

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build frontend
        env:
          # PUBLIC, NON-SECRET: the base URL of the deployed Worker. It contains
          # no credentials. If the variable is unset the site still builds and
          # runs in its clearly-labelled local demo mode.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build -w @detectionforge/web

      - name: Fail the deploy if the bundle contains anything secret-shaped
        run: node scripts/scan-build-artifacts.mjs packages/web/dist

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          # Enable Pages automatically on first run, and set the build type to
          # "GitHub Actions". If this fails, enable it manually under
          # Settings > Pages > Build and deployment > Source: GitHub Actions.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: packages/web/dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
