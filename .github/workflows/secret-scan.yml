name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned gitleaks release. Bump deliberately, not automatically: a scanner
  # that silently changes version can silently change what it detects.
  GITLEAKS_VERSION: 8.21.2

jobs:
  gitleaks:
    name: Gitleaks (working tree and full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Full history so a credential introduced in an earlier commit is
          # found even if it was later removed from the working tree.
          fetch-depth: 0
          persist-credentials: false

      # The official release binary is used rather than gitleaks-action: the
      # action depends on a SARIF upload path and a licence check that are not
      # needed here, and its failure modes are opaque. The download is pinned
      # to a version and verified against the checksum file published in the
      # same release before it is executed.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Check the gitleaks config compiles under RE2
        run: node scripts/check-gitleaks-config.mjs .gitleaks.toml

      - name: Scan commit history
        run: |
          set -euo pipefail
          # --redact keeps any finding's value out of the build log.
          ./gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1

      - name: Scan working tree, including untracked files
        run: |
          set -euo pipefail
          ./gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1

  artifact-scan:
    name: Built artifact scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --install-strategy=hoisted

      - name: Build frontend
        run: npm run build -w @detectionforge/web

      - name: Scan the bundle that would be published
        run: node scripts/scan-build-artifacts.mjs packages/web/dist

      - name: Confirm no secret-bearing file is tracked by git
        run: |
          set -euo pipefail
          tracked=$(git ls-files \
            | grep -E '(^|/)(\.env(\..*)?|\.dev\.vars(\..*)?|.*\.pem|.*\.p12|.*\.key)$' \
            | grep -v -x '.env.example' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Secret-bearing file(s) are tracked by git:"
            echo "$tracked"
            exit 1
          fi
          echo "No tracked environment or key files."
